<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - API Key 管理平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/js/common.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- 导航栏 -->
  <nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <span class="text-lg font-bold text-gray-800">API Key 管理</span>
        <a href="/" class="text-sm font-medium text-blue-600 border-b-2 border-blue-600 pb-1">概览</a>
        <a href="/accounts" class="text-sm text-gray-500 hover:text-gray-700">账号</a>
        <a href="/tasks" class="text-sm text-gray-500 hover:text-gray-700">任务</a>
        <a href="/mail" class="text-sm text-gray-500 hover:text-gray-700">邮件服务商</a>
        <a href="/mail-usages" class="text-sm text-gray-500 hover:text-gray-700">邮箱记录</a>
        <a href="/schedule" class="text-sm text-gray-500 hover:text-gray-700">定时任务</a>
      </div>
      <button onclick="clearToken(); window.location.href='/login'" class="text-sm text-gray-500 hover:text-red-500">退出</button>
    </div>
  </nav>

  <div x-data="dashboardApp()" class="max-w-7xl mx-auto px-6 py-8">

    <!-- 顶部总计卡片 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
        <p class="text-gray-500 text-sm mb-1">总账号数</p>
        <p class="text-3xl font-bold text-gray-900" x-text="stats.total_accounts ?? '-'"></p>
      </div>
      <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
        <p class="text-gray-500 text-sm mb-1">有效 Key</p>
        <p class="text-3xl font-bold text-green-600" x-text="stats.total_valid ?? '-'"></p>
      </div>
      <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
        <p class="text-gray-500 text-sm mb-1">等待中任务</p>
        <p class="text-3xl font-bold text-yellow-600" x-text="stats.pending_tasks ?? '-'"></p>
      </div>
      <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
        <p class="text-gray-500 text-sm mb-1">运行中任务</p>
        <p class="text-3xl font-bold text-blue-600" x-text="stats.running_tasks ?? '-'"></p>
      </div>
    </div>

    <!-- 各平台统计卡片 -->
    <h2 class="text-lg font-semibold text-gray-800 mb-4">各平台统计</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
      <template x-for="svc in stats.services || []" :key="svc.service">
        <div class="bg-white border border-gray-200 rounded-xl p-5 hover:border-gray-300 transition cursor-pointer shadow-sm"
             @click="window.location.href='/accounts?service='+svc.service">
          <div class="flex items-center justify-between mb-3">
            <span class="font-semibold text-gray-900" x-text="serviceLabel(svc.service)"></span>
            <span class="text-xs bg-blue-50 text-blue-700 px-2 py-0.5 rounded">
              今日 +<span x-text="svc.today_new"></span>
            </span>
          </div>
          <div class="text-3xl font-bold text-gray-900 mb-3" x-text="svc.total"></div>
          <div class="flex gap-3 text-xs">
            <span class="text-green-600">✓ 有效 <span x-text="svc.valid"></span></span>
            <span class="text-red-500">✗ 失效 <span x-text="svc.invalid"></span></span>
            <span class="text-gray-500">? 未验证 <span x-text="svc.unverified"></span></span>
          </div>
          <!-- 有效率进度条 -->
          <div class="mt-3 h-1.5 bg-gray-200 rounded-full overflow-hidden">
            <div class="h-full bg-green-500 rounded-full transition-all"
                 :style="`width: ${svc.total > 0 ? Math.round(svc.valid/svc.total*100) : 0}%`"></div>
          </div>
        </div>
      </template>
    </div>

    <!-- 快速操作 -->
    <h2 class="text-lg font-semibold text-gray-800 mb-4">快速操作</h2>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <a href="/tasks" class="bg-blue-600 hover:bg-blue-700 text-white rounded-xl p-4 text-center transition">
        <div class="text-2xl mb-1">🚀</div>
        <div class="text-sm font-medium">创建注册任务</div>
      </a>
      <a href="/accounts" class="bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 rounded-xl p-4 text-center transition">
        <div class="text-2xl mb-1">📋</div>
        <div class="text-sm font-medium">查看所有账号</div>
      </a>
      <a href="/mail" class="bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 rounded-xl p-4 text-center transition">
        <div class="text-2xl mb-1">📧</div>
        <div class="text-sm font-medium">管理邮箱订单</div>
      </a>
      <a href="/schedule" class="bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 rounded-xl p-4 text-center transition">
        <div class="text-2xl mb-1">⏰</div>
        <div class="text-sm font-medium">设置定时任务</div>
      </a>
    </div>

  </div>

  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script>
    function dashboardApp() {
      return {
        stats: {},
        loading: true,

        serviceLabel(s) {
          return SERVICE_LABELS[s] || s;
        },

        async loadStats() {
          try {
            this.stats = await apiJson('/api/stats');
          } catch (e) {
            showToast('加载统计数据失败: ' + e.message, 'error');
          } finally {
            this.loading = false;
          }
        },

        init() {
          requireLogin();
          this.loadStats();
          // 每 30 秒自动刷新
          setInterval(() => this.loadStats(), 30000);
        }
      };
    }
  </script>
</body>
</html>
