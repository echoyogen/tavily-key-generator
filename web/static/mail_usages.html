<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>邮箱使用记录 - API Key 管理</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script src="/static/js/common.js"></script>
<style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-gray-50 min-h-screen" x-data="usagesApp()" x-init="init()" x-cloak>

<!-- 导航 -->
<nav class="bg-white shadow-sm border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <span class="text-lg font-bold text-gray-800">API Key 管理</span>
      <a href="/" class="text-sm text-gray-500 hover:text-gray-700">概览</a>
      <a href="/accounts" class="text-sm text-gray-500 hover:text-gray-700">账号</a>
      <a href="/tasks" class="text-sm text-gray-500 hover:text-gray-700">任务</a>
      <a href="/mail" class="text-sm text-gray-500 hover:text-gray-700">邮件服务商</a>
      <a href="/mail-usages" class="text-sm font-medium text-blue-600 border-b-2 border-blue-600 pb-1">邮箱记录</a>
      <a href="/schedule" class="text-sm text-gray-500 hover:text-gray-700">定时任务</a>
    </div>
    <button onclick="clearToken(); location.href='/login'" class="text-sm text-gray-500 hover:text-red-500">退出</button>
  </div>
</nav>

<div class="max-w-7xl mx-auto px-4 py-8 space-y-5">

  <!-- 标题 + 统计 -->
  <div class="flex items-center justify-between flex-wrap gap-3">
    <h1 class="text-xl font-semibold text-gray-800">邮箱使用记录</h1>
    <div class="flex gap-3 text-sm">
      <span class="bg-white border rounded-lg px-3 py-1 text-gray-600">
        共 <b x-text="total"></b> 条
      </span>
      <span class="bg-green-50 border border-green-200 rounded-lg px-3 py-1 text-green-700">
        成功 <b x-text="counts.success"></b>
      </span>
      <span class="bg-red-50 border border-red-200 rounded-lg px-3 py-1 text-red-600">
        失败 <b x-text="counts.failed"></b>
      </span>
      <span class="bg-yellow-50 border border-yellow-200 rounded-lg px-3 py-1 text-yellow-600">
        进行中 <b x-text="counts.pending"></b>
      </span>
    </div>
  </div>

  <!-- 筛选栏 -->
  <div class="bg-white rounded-xl border border-gray-200 px-5 py-4 flex flex-wrap gap-3 items-end">
    <div>
      <label class="block text-xs text-gray-500 mb-1">服务商</label>
      <select x-model="filter.provider" @change="goPage(1)"
        class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="">全部</option>
        <template x-for="p in providers" :key="p.id">
          <option :value="p.id" x-text="p.name"></option>
        </template>
      </select>
    </div>
    <div>
      <label class="block text-xs text-gray-500 mb-1">目标平台</label>
      <select x-model="filter.service" @change="goPage(1)"
        class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="">全部</option>
        <template x-for="s in services" :key="s">
          <option :value="s" x-text="s"></option>
        </template>
      </select>
    </div>
    <div>
      <label class="block text-xs text-gray-500 mb-1">状态</label>
      <select x-model="filter.status" @change="goPage(1)"
        class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="">全部</option>
        <option value="pending">进行中</option>
        <option value="success">成功</option>
        <option value="failed">失败</option>
        <option value="cancelled">已取消</option>
      </select>
    </div>
    <button @click="load()"
      class="ml-auto bg-blue-600 text-white px-4 py-1.5 rounded-lg text-sm hover:bg-blue-700">刷新</button>
  </div>

  <!-- 表格 -->
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-xs text-gray-500 uppercase tracking-wide">
          <tr>
            <th class="px-4 py-3 text-left">ID</th>
            <th class="px-4 py-3 text-left">邮箱</th>
            <th class="px-4 py-3 text-left">服务商</th>
            <th class="px-4 py-3 text-left">目标平台</th>
            <th class="px-4 py-3 text-left">状态</th>
            <th class="px-4 py-3 text-left">API Key</th>
            <th class="px-4 py-3 text-left">订单号</th>
            <th class="px-4 py-3 text-left">任务</th>
            <th class="px-4 py-3 text-left">时间</th>
            <th class="px-4 py-3 text-left">失败原因</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          <template x-if="items.length === 0">
            <tr><td colspan="10" class="px-4 py-10 text-center text-gray-400">暂无记录</td></tr>
          </template>
          <template x-for="u in items" :key="u.id">
            <tr class="hover:bg-gray-50 transition">
              <td class="px-4 py-3 text-gray-400 text-xs" x-text="u.id"></td>
              <td class="px-4 py-3 font-mono text-xs max-w-[200px] truncate" :title="u.email" x-text="u.email"></td>
              <td class="px-4 py-3 text-xs text-gray-600" x-text="u.provider_name || u.provider_id"></td>
              <td class="px-4 py-3">
                <span x-show="u.target_service"
                  class="text-xs px-2 py-0.5 rounded-full bg-blue-50 text-blue-700"
                  x-text="u.target_service"></span>
                <span x-show="!u.target_service" class="text-gray-300">-</span>
              </td>
              <td class="px-4 py-3">
                <span class="text-xs px-2 py-0.5 rounded-full font-medium"
                  :class="{
                    'bg-green-100 text-green-700': u.status==='success',
                    'bg-red-100 text-red-600':    u.status==='failed',
                    'bg-yellow-100 text-yellow-600': u.status==='pending',
                    'bg-gray-100 text-gray-500':  u.status==='cancelled',
                  }"
                  x-text="{'success':'成功','failed':'失败','pending':'进行中','cancelled':'已取消'}[u.status] || u.status">
                </span>
              </td>
              <td class="px-4 py-3">
                <span x-show="u.api_key" class="font-mono text-xs text-gray-600 cursor-pointer hover:text-blue-600"
                  @click="copyText(u.api_key)"
                  :title="u.api_key"
                  x-text="u.api_key ? u.api_key.slice(0,16)+'…' : ''"></span>
                <span x-show="!u.api_key" class="text-gray-300">-</span>
              </td>
              <td class="px-4 py-3 font-mono text-xs text-gray-500" x-text="u.order_id || '-'"></td>
              <td class="px-4 py-3 text-xs">
                <a x-show="u.task_id" :href="'/tasks'" class="text-blue-500 hover:underline"
                  x-text="'#' + u.task_id"></a>
                <span x-show="!u.task_id" class="text-gray-300">-</span>
              </td>
              <td class="px-4 py-3 text-xs text-gray-500 whitespace-nowrap">
                <div x-text="fmtDate(u.created_at)"></div>
                <div x-show="u.finished_at" class="text-gray-400" x-text="fmtDate(u.finished_at)"></div>
              </td>
              <td class="px-4 py-3 text-xs text-red-500 max-w-[160px] truncate"
                :title="u.fail_reason" x-text="u.fail_reason || '-'"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <!-- 分页 -->
    <div class="px-5 py-3 border-t border-gray-100 flex items-center justify-between text-sm text-gray-600">
      <span>第 <b x-text="page"></b> 页，共 <b x-text="Math.ceil(total/pageSize) || 1"></b> 页</span>
      <div class="flex gap-2">
        <button @click="goPage(page-1)" :disabled="page<=1"
          class="px-3 py-1 rounded border border-gray-300 disabled:opacity-40 hover:bg-gray-50">上一页</button>
        <button @click="goPage(page+1)" :disabled="page>=Math.ceil(total/pageSize)"
          class="px-3 py-1 rounded border border-gray-300 disabled:opacity-40 hover:bg-gray-50">下一页</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div x-show="toast.show" x-transition
  class="fixed bottom-6 right-6 px-4 py-3 rounded-xl text-sm text-white shadow-lg z-50"
  :class="toast.ok ? 'bg-green-600' : 'bg-red-500'"
  x-text="toast.msg"></div>

<script>
function usagesApp() {
  return {
    items: [], total: 0, page: 1, pageSize: 20,
    providers: [],
    services: ['tavily','firecrawl','exa','you','serper','valyu'],
    filter: { provider: '', service: '', status: '' },
    counts: { success: 0, failed: 0, pending: 0 },
    toast: { show: false, ok: true, msg: '' },

    async init() {
      if (!getToken()) { location.href = '/login'; return; }
      // 读 URL 参数 provider
      const params = new URLSearchParams(location.search);
      if (params.get('provider')) this.filter.provider = params.get('provider');
      const [_, providers] = await Promise.all([this.load(), this.loadProviders()]);
      await this.loadCounts();
    },

    async loadProviders() {
      this.providers = await apiJson('/api/mail-providers');
    },

    async load() {
      const pid = this.filter.provider;
      const base = pid ? `/api/mail-providers/${pid}/usages` : '/api/mail-providers/usages';
      const q = new URLSearchParams({ page: this.page, page_size: this.pageSize });
      if (this.filter.service) q.set('target_service', this.filter.service);
      if (this.filter.status) q.set('status', this.filter.status);
      const data = await apiJson(`${base}?${q}`);
      this.items = data.items;
      this.total = data.total;
    },

    async loadCounts() {
      const pid = this.filter.provider;
      const base = pid ? `/api/mail-providers/${pid}/usages` : '/api/mail-providers/usages';
      const sv = this.filter.service ? `&target_service=${this.filter.service}` : '';
      const [s, f, p] = await Promise.all([
        apiJson(`${base}?page=1&page_size=1&status=success${sv}`),
        apiJson(`${base}?page=1&page_size=1&status=failed${sv}`),
        apiJson(`${base}?page=1&page_size=1&status=pending${sv}`),
      ]);
      this.counts = { success: s.total, failed: f.total, pending: p.total };
    },

    async goPage(n) {
      const max = Math.ceil(this.total / this.pageSize) || 1;
      this.page = Math.max(1, Math.min(n, max));
      await this.load();
    },

    showToast(msg, ok = true) {
      this.toast = { show: true, ok, msg };
      setTimeout(() => this.toast.show = false, 3000);
    },

    copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        this.showToast('已复制');
      });
    },
  };
}
</script>
</body>
</html>
