<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册任务 - API Key 管理平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/js/common.js"></script>
</head>
<body class="min-h-screen bg-gray-950 text-gray-200">

  <nav class="bg-gray-900 border-b border-gray-700 px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <span class="text-white font-bold text-lg">🔑 Key 管理平台</span>
      <a href="/" class="text-gray-400 hover:text-gray-200 text-sm">Dashboard</a>
      <a href="/accounts" class="text-gray-400 hover:text-gray-200 text-sm">账号管理</a>
      <a href="/tasks" class="text-blue-400 text-sm font-medium">注册任务</a>
      <a href="/mail" class="text-gray-400 hover:text-gray-200 text-sm">邮箱订单</a>
      <a href="/schedule" class="text-gray-400 hover:text-gray-200 text-sm">定时任务</a>
    </div>
    <button onclick="clearToken(); window.location.href='/login'" class="text-gray-500 hover:text-red-400 text-sm transition">退出登录</button>
  </nav>

  <div x-data="tasksApp()" class="max-w-7xl mx-auto px-6 py-6">

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- 左侧：创建任务表单 -->
      <div class="lg:col-span-1">
        <div class="bg-gray-900 border border-gray-700 rounded-xl p-5">
          <h2 class="text-base font-semibold text-white mb-4">创建注册任务</h2>
          <form @submit.prevent="createTask">
            <div class="mb-4">
              <label class="block text-xs text-gray-400 mb-1">目标平台</label>
              <select x-model="form.service"
                class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white">
                <option value="tavily">Tavily</option>
                <option value="firecrawl">Firecrawl</option>
                <option value="exa">Exa</option>
                <option value="you">You.com</option>
                <option value="serper">Serper</option>
                <option value="valyu">Valyu</option>
              </select>
            </div>
            <div class="mb-4">
              <label class="block text-xs text-gray-400 mb-1">注册数量</label>
              <input x-model.number="form.count" type="number" min="1" max="500"
                class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white" />
            </div>
            <div class="mb-4">
              <label class="block text-xs text-gray-400 mb-1">并发数</label>
              <input x-model.number="form.concurrency" type="number" min="1" max="20"
                class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white" />
            </div>
            <div class="mb-4">
              <label class="block text-xs text-gray-400 mb-1">任务间隔（秒）</label>
              <input x-model.number="form.delay" type="number" min="0" max="300"
                class="w-full bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white" />
            </div>
            <div class="mb-5 flex items-center gap-2">
              <input type="checkbox" x-model="form.upload" id="upload" class="rounded" />
              <label for="upload" class="text-sm text-gray-300">完成后上传到 Key 池</label>
            </div>
            <button type="submit" :disabled="creating"
              class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-900 text-white font-semibold py-2 rounded-lg transition">
              <span x-text="creating ? '提交中...' : '🚀 提交任务'"></span>
            </button>
          </form>
        </div>
      </div>

      <!-- 右侧：任务列表 + 日志 -->
      <div class="lg:col-span-2 flex flex-col gap-4">

        <!-- 任务列表 -->
        <div class="bg-gray-900 border border-gray-700 rounded-xl overflow-hidden">
          <div class="flex items-center justify-between px-4 py-3 border-b border-gray-700">
            <h2 class="text-base font-semibold text-white">最近任务</h2>
            <button @click="loadTasks()" class="text-gray-400 hover:text-white text-xs transition">刷新</button>
          </div>
          <div class="divide-y divide-gray-800 max-h-64 overflow-y-auto">
            <template x-if="tasks.length === 0">
              <div class="text-center py-8 text-gray-500 text-sm">暂无任务</div>
            </template>
            <template x-for="task in tasks" :key="task.id">
              <div class="px-4 py-3 hover:bg-gray-800/50 transition cursor-pointer"
                   @click="selectTask(task)">
                <div class="flex items-center justify-between mb-1">
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-medium text-blue-300" x-text="serviceLabel(task.service)"></span>
                    <span x-html="taskStatusLabel(task.status)"></span>
                  </div>
                  <span class="text-xs text-gray-500" x-text="fmtDateShort(task.created_at)"></span>
                </div>
                <div class="flex items-center justify-between text-xs text-gray-400">
                  <span>
                    进度: <span class="text-white" x-text="task.success + task.failed"></span>/<span x-text="task.total"></span>
                    &nbsp;✅<span x-text="task.success"></span>
                    &nbsp;❌<span x-text="task.failed"></span>
                  </span>
                  <div class="flex gap-2">
                    <button x-show="task.status === 'running' || task.status === 'pending'"
                      @click.stop="cancelTask(task)"
                      class="text-red-400 hover:text-red-300">取消</button>
                  </div>
                </div>
                <!-- 进度条 -->
                <div class="mt-2 h-1 bg-gray-700 rounded-full overflow-hidden">
                  <div class="h-full bg-blue-500 rounded-full transition-all"
                       :style="`width: ${task.total > 0 ? Math.round((task.success + task.failed)/task.total*100) : 0}%`"></div>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- 实时日志 -->
        <div class="bg-gray-900 border border-gray-700 rounded-xl overflow-hidden flex flex-col" style="min-height:320px">
          <div class="flex items-center justify-between px-4 py-3 border-b border-gray-700">
            <h2 class="text-base font-semibold text-white">
              实时日志
              <span x-show="selectedTask" class="text-xs text-gray-400 ml-2">
                任务 #<span x-text="selectedTask?.id"></span>
                - <span x-text="serviceLabel(selectedTask?.service)"></span>
              </span>
            </h2>
            <div class="flex items-center gap-3">
              <div x-show="streamActive" class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
              <button @click="clearLogs()" class="text-gray-400 hover:text-white text-xs transition">清空</button>
            </div>
          </div>
          <div x-show="!selectedTask" class="flex-1 flex items-center justify-center text-gray-500 text-sm">
            点击左侧任务查看日志
          </div>
          <div x-show="selectedTask" id="log-container"
               class="flex-1 overflow-y-auto p-4 font-mono text-xs space-y-0.5 bg-gray-950"
               style="max-height:400px">
            <template x-for="log in logs" :key="log.id">
              <div :class="logClass(log.level)">
                <span class="text-gray-600 mr-2" x-text="fmtDateShort(log.created_at)"></span>
                <span x-text="log.message"></span>
              </div>
            </template>
            <div x-show="logs.length === 0" class="text-gray-600">暂无日志...</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script>
    function tasksApp() {
      return {
        tasks: [],
        selectedTask: null,
        logs: [],
        creating: false,
        streamActive: false,
        _eventSource: null,
        _pollTimer: null,

        form: {
          service: 'firecrawl',
          count: 1,
          concurrency: 2,
          delay: 0,
          upload: false,
        },

        serviceLabel: (s) => SERVICE_LABELS[s] || s,
        fmtDateShort,
        taskStatusLabel,

        logClass(level) {
          const map = {
            success: 'text-green-400',
            error: 'text-red-400',
            warning: 'text-yellow-400',
            info: 'text-gray-300',
          };
          return map[level] || 'text-gray-300';
        },

        async loadTasks() {
          try {
            this.tasks = await apiJson('/api/tasks?limit=30');
            // 更新已选中任务的状态
            if (this.selectedTask) {
              const updated = this.tasks.find(t => t.id === this.selectedTask.id);
              if (updated) this.selectedTask = updated;
            }
          } catch (e) {
            showToast('加载任务失败: ' + e.message, 'error');
          }
        },

        async createTask() {
          this.creating = true;
          try {
            const task = await apiJson('/api/tasks', {
              method: 'POST',
              body: JSON.stringify(this.form),
            });
            showToast('任务已创建', 'success');
            await this.loadTasks();
            this.selectTask(task);
          } catch (e) {
            showToast('创建失败: ' + e.message, 'error');
          } finally {
            this.creating = false;
          }
        },

        async cancelTask(task) {
          try {
            await apiFetch('/api/tasks/' + task.id, { method: 'DELETE' });
            showToast('已发送取消信号', 'info');
            await this.loadTasks();
          } catch (e) {
            showToast('取消失败: ' + e.message, 'error');
          }
        },

        selectTask(task) {
          this.selectedTask = task;
          this.logs = [];
          this.stopStream();
          this.startStream(task.id);
        },

        clearLogs() {
          this.logs = [];
        },

        startStream(taskId) {
          this.stopStream();
          this.streamActive = true;
          const token = getToken();
          let cursor = 0;

          const connect = () => {
            const url = `/api/tasks/${taskId}/stream?cursor=${cursor}&token=${encodeURIComponent(token)}`;
            const es = new EventSource(url);
            this._eventSource = es;

            es.onmessage = (e) => {
              const lines = e.data.split('\n');
              const log = { id: parseInt(lines[0].replace('id:', '')), level: lines[1].replace('level:', ''), message: lines.slice(2).join('\n'), created_at: new Date().toISOString() };
              cursor = log.id;
              this.logs.push(log);
              // 滚动到底部
              this.$nextTick(() => {
                const el = document.getElementById('log-container');
                if (el) el.scrollTop = el.scrollHeight;
              });
            };

            es.addEventListener('done', (e) => {
              this.streamActive = false;
              es.close();
              this.loadTasks();
            });

            es.onerror = () => {
              es.close();
              this.streamActive = false;
            };
          };

          connect();

          // 同时轮询任务状态
          this._pollTimer = setInterval(() => this.loadTasks(), 5000);
        },

        stopStream() {
          if (this._eventSource) {
            this._eventSource.close();
            this._eventSource = null;
          }
          if (this._pollTimer) {
            clearInterval(this._pollTimer);
            this._pollTimer = null;
          }
          this.streamActive = false;
        },

        init() {
          requireLogin();
          this.loadTasks();
          setInterval(() => this.loadTasks(), 10000);
        },

        destroy() {
          this.stopStream();
        }
      };
    }
  </script>
</body>
</html>
