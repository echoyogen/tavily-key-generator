<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - API Key 管理平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/js/common.js"></script>
</head>
<body class="min-h-screen bg-gray-950 flex items-center justify-center">
  <div x-data="loginApp()" class="w-full max-w-sm">
    <div class="bg-gray-900 border border-gray-700 rounded-2xl p-8 shadow-2xl">
      <div class="text-center mb-8">
        <div class="text-4xl mb-3">🔑</div>
        <h1 class="text-2xl font-bold text-white">API Key 管理平台</h1>
        <p class="text-gray-400 text-sm mt-1">请登录以继续</p>
      </div>

      <form @submit.prevent="login">
        <div class="mb-4">
          <label class="block text-sm text-gray-400 mb-1">用户名</label>
          <input
            x-model="username"
            type="text"
            autocomplete="username"
            class="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
            placeholder="admin"
            required
          />
        </div>

        <div class="mb-6">
          <label class="block text-sm text-gray-400 mb-1">密码</label>
          <input
            x-model="password"
            type="password"
            autocomplete="current-password"
            class="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
            placeholder="••••••••"
            required
          />
        </div>

        <div x-show="error" class="mb-4 p-3 bg-red-900/50 border border-red-700 rounded-lg text-red-300 text-sm" x-text="error"></div>

        <button
          type="submit"
          :disabled="loading"
          class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-900 text-white font-semibold py-2.5 rounded-lg transition flex items-center justify-center gap-2"
        >
          <span x-show="loading" class="animate-spin">⏳</span>
          <span x-text="loading ? '登录中...' : '登录'"></span>
        </button>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script>
    function loginApp() {
      return {
        username: '',
        password: '',
        error: '',
        loading: false,

        async login() {
          this.error = '';
          this.loading = true;
          try {
            const res = await fetch('/api/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: this.username, password: this.password }),
            });
            const data = await res.json();
            if (!res.ok) {
              this.error = data.detail || '登录失败';
              return;
            }
            setToken(data.access_token);
            window.location.href = '/';
          } catch (e) {
            this.error = '网络错误，请重试';
          } finally {
            this.loading = false;
          }
        },

        init() {
          if (isLoggedIn()) window.location.href = '/';
        }
      };
    }
  </script>
</body>
</html>
